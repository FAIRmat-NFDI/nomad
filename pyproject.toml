[build-system]
requires = ["setuptools>=77", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "nomad-lab"
description = "The NOvel MAterials Discovery (NOMAD) Python package"
readme = "README.md"
authors = [
  { name = "NOMAD Laboratory", email = "markus.scheidgen@physik.hu-berlin.de" },
]
dynamic = ["version"]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
  "ase>=3.25.0",
  "bitarray>=2.3.5",
  "cachetools>=4.2.4",
  "click>=7.1.2",
  "docstring-parser>=0.12",
  "elasticsearch>=9,<10",
  "elasticsearch7>=7.17,<8",
  "fsspec>=2026.2.0",
  "h5py>=3.6.0",
  "httpx2>=2,<3",
  "jmespath>=0.10.0",
  "jsonpath-ng",
  "json_stream",
  "kaleido<=0.2.1", # v1.0.0 not compatible with plotly < 6.0.0
  "lxml>=5.2",
  "matid>=2.1.3",
  'molid>=0.8.5',
  "msglc[msgspec,s3fs]>=260825",
  "numpy>=1.22.4",
  "openpyxl",
  "orjson>=1.0",
  "pandas>=2",
  "pathvalidate",
  "pint>=0.23",
  "plotly<6", # version 6.0.0 not fully compatible with our GUI
  "py-spy", # for on-server profiling
  "pydantic>=2",
  "pyinstrument", # for endpoint profiling
  "pymatgen>=2025.10.7",
  "python-keycloak>=5.0",
  "python-magic-bin;sys_platform=='win32'",
  "python-magic;sys_platform!='win32'",
  "pyyaml>=6.0",
  "requests>=2.27.1",
  "rfc3161ng>=2.1.3",
  "scipy>=1.7.1",
  "unidecode",
  "xarray>=0.20.2",
]

[project.urls]
homepage = "https://nomad-lab.eu/"
documentation = "https://nomad-lab.eu/prod/v1/docs"
repository = "https://gitlab.mpcdf.mpg.de/nomad-lab/nomad-FAIR"

[project.optional-dependencies]
parsing = []
infrastructure = [
  "beautifulsoup4>=4,<=4.12.3", # 4.13 introduced breaking changes
  "blinker", # mongoengine needs this for signals
  "dockerspawner",
  # TODO: fastapi upper pin: https://github.com/Materials-Consortia/optimade-python-tools/issues/2383
  "fastapi>=0.99.0,<0.137.0",
  "starlette>=1.3.1",
  "fastapi-cache2",
  "gunicorn",
  "h5grove[fastapi]>=3", # interface change in 3
  "jupyterhub<5.0.0", # Connection issues with newer versions
  "beanie>=2.0.0",
  "mongoengine",
  "oauthenticator>=16.3.1",
  "optimade[mongo]>=1.2.0,<1.4.0", # `optimade.server.config.CONFIG` removed
  "pyjwt[crypto]>=2.15.0",
  "python-logstash",
  "python-multipart>=0.0.27",
  "rdflib==5", # breaking changes in DCT.dataset in later versions
  "structlog",
  "tabulate",
  "temporalio>=1.27.2",
  "cryptography",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
  "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-asgi==0.63b1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
  "opentelemetry-instrumentation-pymongo==0.63b1",
  "opentelemetry-instrumentation-elasticsearch==0.63b1",
  "prometheus-client",
  "uvicorn[standard]",
  "validators",
  "zipstream-ng",
]
dev = [
  "aiosmtpd>=1",
  "essential_generators",
  "mypy>=1.15",
  "pip-audit",
  "pip>=26.1.2", # (required by pip-audit) CVE in lower version
  "pytest-asyncio",
  "pytest-cov",
  "pytest-socket",
  "pytest-split",
  "pytest-timeout",
  "pytest-xdist",
  "pytest",
  "python-gitlab",
  "ruff>=0.16.0",
]


[project.scripts]
nomad = "nomad.cli:run_cli"

[tool.ruff]
include = ["nomad/**/*.py", "tests/**/*.py", "examples/**/*.py", "ops/**/*.py"]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  "E", # pycodestyle
  "CPY001", # missing copyright notice
  "F401", # remove unused import
  "FAST", # FastAPI
  "I001", # sort imports
  "PL", # pylint
  "UP", # pyupgrade
  "W", # pycodestyle
]
ignore = [
  "E402", # Module level import not at top of file
  "E501", # Line too long ({width} > {limit} characters)
  "E701", # Multiple statements on one line (colon)
  "E731", # Do not assign a lambda expression, use a def
  "PLR0904", # too-many-public-methods
  "PLR0911", # Too many return statements
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "PLR0917", # too-many-positional-arguments
  "PLR1714", # consider-using-in
  "PLR2004", # Magic value used instead of constant
  "PLR5501", # else-if-used
  "PLW0603", # Using the global statement
  "PLW2901", # redefined-loop-name
  "PLC0415", # import-outside-top-level
]
fixable = ["ALL"]
isort.split-on-trailing-comma = false

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401", "I001"]
"nomad/app/v1/models/graph/utils.py" = [
  "UP007",
] # causes pydantic model building errors

[tool.ruff.lint.flake8-copyright]
notice-rgx = '''(?m)^#
# Copyright The NOMAD Authors\.
#
# This file is part of NOMAD\. See https://nomad-lab\.eu for further info\.
#
# Licensed under the Apache License, Version 2\.0 \(the "License"\);
# you may not use this file except in compliance with the License\.
# You may obtain a copy of the License at
#
#     http://www\.apache\.org/licenses/LICENSE-2\.0
#
# Unless required by applicable law or agreed to in writing, software
# distributed under the License is distributed on an "AS IS" BASIS,
# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied\.
# See the License for the specific language governing permissions and
# limitations under the License\.
#'''

[tool.ruff.format]
# use single quotes for strings.
quote-style = "single"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
namespaces = false

[tool.mypy]
strict = false
ignore_missing_imports = true
follow_imports = "silent"
no_strict_optional = true
disable_error_code = "import, annotation-unchecked"
plugins = ["pydantic.mypy"]

[tool.setuptools_scm]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
override-dependencies = ["elasticsearch>=9"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]
markers = [
  "disable_health_check_patch: By default the health check is patched in the transfer bundle operations. This marker is useful in the transfer bundle context.",
  "enable_target_deployment_url_validation: By default the target deployment url validation is patched in the transfer bundle operations. This marker is useful in the transfer bundle context.",
]
